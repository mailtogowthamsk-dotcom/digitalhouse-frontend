<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/digitalhouse/admin/favicon.png" />
    <link rel="apple-touch-icon" href="/digitalhouse/admin/logo.png" />
    <title>Digital House – Admin</title>
    <script>
      (function () {
        // On production host only: rewrite absolute API URLs to same-origin paths
        // so Apache can proxy /digitalhouse/backend → Node. Skip on localhost
        // (Vite) so VITE_API_BASE can call the live server directly.
        var host = (location.hostname || "").toLowerCase();
        var onProdHost =
          host === "infosensetechnologies.com" ||
          host === "www.infosensetechnologies.com";
        if (!onProdHost) return;

        var f = window.fetch.bind(window);
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input instanceof Request ? input.url : String(input);
          if (/^https?:\/\/infosensetechnologies\.com\//i.test(url)) {
            url = url.replace(/^https?:\/\/infosensetechnologies\.com/i, "https://www.infosensetechnologies.com");
          }
          if (/infosensetechnologies\.com\/digitalhouse\/backend/i.test(url)) {
            url = url.replace(/^https?:\/\/(?:www\.)?infosensetechnologies\.com/i, "");
            if (!url.startsWith("/")) url = "/" + url;
          }
          if (typeof input === "string") return f(url, init);
          if (input instanceof Request) return f(new Request(url, input), init);
          return f(url, init);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
